$schema: '../../.moon/cache/schemas/project.json'

language: 'typescript'

toolchains:
  typescript:
    syncProjectReferences: false
    syncProjectReferencesToPaths: false

tasks:
  coverage-report:
    options:
      runInCI: true
      outputStyle: 'buffer'
    deps:
      - '#vitest:test-cov'
      - '#ava:test-cov'
    command: 'node ./src/merge-coverage.ts'
