$schema: '../cache/schemas/tasks.json'

inheritedBy:
  toolchain: 'node'

fileGroups:
  sources:
    - '*.{ts,js}'
    - 'src/**/*.{ts,js}'
    - '!node_modules/**'
  tests:
    - 'tests/**/*.{ts,js}'

implicitInputs:
  - 'package.json'
  - '/package.json'
  - '/pnpm-workspace.yaml'
  - '/pnpm-lock.yaml'
